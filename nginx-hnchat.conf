# ============================================================
#  Nginx — كل نطاق معزول لوحده + نطاق المدير admin.hnchat.net
#  انسخه إلى: /etc/nginx/sites-available/hnchat
# ============================================================

upstream hnchat_backend {
  server 127.0.0.1:3000;
  keepalive 32;
}

# ---------- النطاق 1: hn-chat.com ----------
server {
  listen 80; listen [::]:80;
  server_name hn-chat.com;
  root /var/www/hnchat/.output/public;

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  location / {
    proxy_pass http://hnchat_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host hn-chat.com;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# ---------- النطاق 2: www.hn-chat.com ----------
server {
  listen 80; listen [::]:80;
  server_name www.hn-chat.com;
  root /var/www/hnchat/.output/public;

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  location / {
    proxy_pass http://hnchat_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host www.hn-chat.com;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# ---------- النطاق 3: hnchat.net (مستضاف على FTP، ليس هنا) ----------
# لا حاجة لـ server block هنا. الواجهة على cPanel/FTP،
# وتتصل مباشرة بـ Lovable Cloud (Supabase) من المتصفح.

# ---------- النطاق 4: www.hnchat.net ----------
# يتم التعامل معه من نفس مساحة FTP (CNAME → hnchat.net)

# ---------- 🛡️ نطاق المدير: admin.hnchat.net ----------
# لوحة تحكم المالك/المدير فقط — معزول تماماً عن باقي النطاقات
# يخدم نفس التطبيق لكن يفتح مباشرة على /admin
server {
  listen 80; listen [::]:80;
  server_name admin.hnchat.net;
  root /var/www/hnchat/.output/public;

  # السماح فقط بعناوين IP محددة (اختياري — أزل التعليق وضع IP الخاص بك)
  # allow 1.2.3.4;
  # deny all;

  # توجيه الجذر إلى /admin
  location = / {
    return 302 /admin;
  }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  location / {
    proxy_pass http://hnchat_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host admin.hnchat.net;
    proxy_set_header X-Admin-Domain "true";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# ============================================================
# ملاحظات:
# - hnchat.net و www.hnchat.net → مساحة FTP (cPanel) مباشرة، لا تمر بـ Nginx
# - hn-chat.com و www.hn-chat.com → VPS (هذا الملف)
# - admin.hnchat.net → VPS فقط، لوحة المدير
# - كل النطاقات معزولة، لا redirects بينها
# - بعد certbot ستُنشأ blocks 443 تلقائياً بنفس البنية
# ============================================================
