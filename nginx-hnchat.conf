# ملاحظة:
# - كل server block مستقل، لا يوجد return 301 من نطاق لآخر.
# - كل نطاق يحافظ على عنوانه في شريط المتصفح.
# - بعد تشغيل certbot ستتم إضافة blocks للـ 443 تلقائياً بنفس العزل.
