# ============================================================
#  Nginx — كل نطاق معزول لوحده (بدون إعادة توجيه بينها)
#  انسخه إلى: /etc/nginx/sites-available/hnchat
# ============================================================

upstream hnchat_backend {
  server 127.0.0.1:3000;
  keepalive 32;
}

# ---------- النطاق 1: hn-chat.com ----------
server {
  listen 80;
  listen [::]:80;
  server_name hn-chat.com;

  location /assets/ {
    alias /var/www/hnchat/.output/public/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://hnchat_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host hn-chat.com;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 90;
  }
}

# ---------- النطاق 2: www.hn-chat.com ----------
